<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#414aba">
  <title>ETC 2026 — Vote anonyme</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">ETC 2026 · <span>QCM HTS / HCS</span></div>
      <div class="privacy">Aucun nom ni courriel demandé</div>
    </div>
  </header>

  <main class="page">
    <section id="joinView" class="card join-card">
      <div class="eyebrow">Participation anonyme</div>
      <h1>Rejoindre la séance</h1>
      <p class="muted">Saisissez le code affiché par le formateur.</p>
      <form id="joinForm">
        <input id="sessionInput" class="code-input" type="text" inputmode="text" autocomplete="off" maxlength="8" placeholder="ABC123" aria-label="Code de séance" required>
        <button class="primary" type="submit">REJOINDRE</button>
      </form>
      <p id="joinError" class="muted" role="alert"></p>
    </section>

    <section id="participantView" class="participant-shell hidden">
      <div class="session-line">
        <span><i id="connectionDot" class="status-dot"></i><span id="connectionLabel">Connexion…</span></span>
        <span id="sessionCode" class="session-code"></span>
      </div>

      <div id="waitingView" class="card waiting-card">
        <div class="pulse"></div>
        <h1>En attente de la prochaine question</h1>
        <p class="muted">Gardez cette page ouverte. La question apparaîtra automatiquement.</p>
      </div>

      <article id="questionView" class="card question-card hidden">
        <header class="question-head">
          <div id="questionBlock" class="eyebrow"></div>
          <h1 id="questionTitle"></h1>
          <p id="questionContext"></p>
        </header>
        <div id="answersList" class="answers-list"></div>
        <div id="voteFeedback" class="vote-feedback">Choisissez une réponse.</div>
      </article>

      <div id="correctionView" class="correction hidden">
        <b id="correctionAnswer"></b>
        <span id="correctionText"></span>
      </div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="vote.js"></script>
</body>
</html>
